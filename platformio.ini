[platformio]
default_envs = nucleo_f446re
test_default_envs = native

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
  -DSTM32F446xx
  -DUSE_HAL_DRIVER
  -DDEBUG
build_src_filter =
  +<*> -<socketcan_bus.cpp>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<socketcan_bus.cpp>
build_flags =
  -Isrc
